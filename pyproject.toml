[project]
name = "aeris-predictive-maintenance"
version = "0.1.0"
description = "Synthetic wind-turbine Predictive Maintenance prototype for Delopgave 2"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
