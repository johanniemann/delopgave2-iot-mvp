<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Aeris fra browser til privat database</title>
<desc id="desc">Browseren på brugerens computer sender HTTPS-forespørgsler til Caddy på Azure VM. Caddy videresender til FastAPI. FastAPI læser og skriver til PostgreSQL på et privat netværk. Databasen har et vedvarende volume.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#36564e"/></marker></defs>
<rect width="1200" height="570" fill="white"/>
<rect x="380" y="25" width="800" height="475" rx="14" fill="#f3f6f5" stroke="#a7b7b2" stroke-width="2"/>
<g font-family="Liberation Sans,Arial,sans-serif" fill="#152a25">
<text x="410" y="70" font-size="28" font-weight="bold">Den eksisterende Azure VM</text>
<rect x="20" y="115" width="270" height="140" rx="9" fill="#e4eeeb" stroke="#78978c" stroke-width="2"/>
<text x="155" y="170" text-anchor="middle" font-size="32" font-weight="bold">Browser</text>
<text x="155" y="215" text-anchor="middle" font-size="26">På din computer</text>
<rect x="430" y="115" width="290" height="140" rx="9" fill="white" stroke="#78978c" stroke-width="2"/>
<text x="575" y="170" text-anchor="middle" font-size="32" font-weight="bold">Caddy</text>
<text x="575" y="215" text-anchor="middle" font-size="26">HTTPS og certifikat</text>
<rect x="430" y="325" width="290" height="140" rx="9" fill="white" stroke="#78978c" stroke-width="2"/>
<text x="575" y="380" text-anchor="middle" font-size="32" font-weight="bold">FastAPI</text>
<text x="575" y="425" text-anchor="middle" font-size="26">Adgang og regler</text>
<rect x="855" y="325" width="290" height="140" rx="9" fill="white" stroke="#78978c" stroke-width="2"/>
<text x="1000" y="380" text-anchor="middle" font-size="32" font-weight="bold">PostgreSQL</text>
<text x="1000" y="425" text-anchor="middle" font-size="26">Data i varigt lager</text>
<path d="M290 185H417M575 255V312M720 395H842" stroke="#36564e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="352" y="153" text-anchor="middle" font-size="25">HTTPS</text>
<text x="610" y="295" font-size="25">Internt</text>
<text x="790" y="363" text-anchor="middle" font-size="25">Privat</text>
<text x="25" y="550" font-size="26">Browseren bruger API'et og har ingen direkte adgang til databasen.</text>
</g></svg>
